name: Price Check

# Scheduled price checks run from cron-job.org (every 5 min, GET /api/cron with
# x-cron-secret). GitHub's schedule was unreliable (runs hours apart) and was
# auto-disabled after 60 days of repo inactivity. Kept for manual runs only.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price check
        run: |
          BODY=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/cron")
          STATUS=$(echo "$BODY" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          RESPONSE=$(echo "$BODY" | sed '/HTTP_STATUS:/d')
          echo "Response status: $STATUS"
          echo "Response body: $RESPONSE"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: price check returned $STATUS"
            exit 1
          fi
