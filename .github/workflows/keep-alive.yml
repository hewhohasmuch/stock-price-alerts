name: Price Check

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price check
        run: |
          BODY=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/cron")
          STATUS=$(echo "$BODY" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          RESPONSE=$(echo "$BODY" | sed '/HTTP_STATUS:/d')
          echo "Response status: $STATUS"
          echo "Response body: $RESPONSE"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: price check returned $STATUS"
            exit 1
          fi
